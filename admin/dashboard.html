<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vijay Events Admin Dashboard</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!--================ SIDEBAR ================-->

<aside class="sidebar">

<div class="logo">

<h2>Vijay Events</h2>

<p>Admin Panel</p>

</div>

<ul>

<li class="active" data-page="dashboard">

<i class="fa-solid fa-chart-line"></i>

<span>Dashboard</span>

</li>

<li data-page="bookings">

<i class="fa-solid fa-calendar-check"></i>

<span>Bookings</span>

</li>

<li data-page="reviews">

<i class="fa-solid fa-star"></i>

<span>Reviews</span>

</li>

<li data-page="messages">

<i class="fa-solid fa-envelope"></i>

<span>Messages</span>

</li>

<li id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

<span>Logout</span>

</li>

</ul>

</aside>

<!--================ MAIN ================-->

<main class="main">

<header>

<h1 id="pageTitle">

Dashboard

</h1>

</header>

<!--================ DASHBOARD ================-->

<section
id="dashboard"
class="page active">

<div class="cards">

<div class="card">

<h3>Total Bookings</h3>

<h1 id="totalBookings">

0

</h1>

</div>

<div class="card">

<h3>Pending</h3>

<h1 id="pendingBookings">

0

</h1>

</div>

<div class="card">

<h3>Total Reviews</h3>

<h1 id="totalReviews">

0

</h1>

</div>

<div class="card">

<h3>Average Rating</h3>

<h1>

⭐

<span id="avgRating">

0.0

</span>

</h1>

</div>

</div>

<!--================ RECENT DATA ================-->

<div class="dashboard-grid">

<div class="dashboard-panel">

<h2>

Latest Bookings

</h2>

<div id="recentBookings">

</div>

</div>

<div class="dashboard-panel">

<h2>

Latest Reviews

</h2>

<div id="recentReviews">

</div>

</div>

</div>

</section>

<!--================ BOOKINGS ================-->

<section
id="bookings"
class="page">

<h2>

Booking Requests

</h2>

<div id="bookingTable">

</div>

</section>

<!--================ REVIEWS ================-->

<section
id="reviews"
class="page">

<h2>

Customer Reviews

</h2>

<div id="reviewTable">

</div>

</section>

<!--================ MESSAGES ================-->

<section
id="messages"
class="page">

<h2>

Customer Inquiries

</h2>

<div id="messagesContainer">

</div>

</section>

</main>

<script type="module"
src="dashboard.js"></script>

</body>

</html>
